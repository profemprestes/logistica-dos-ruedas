<!doctype html>
<!--
  Lo único que viaja adentro del APK.

  La app abre el sitio de la red, así que esta página normalmente no se ve
  nunca. Aparece si el celular no llega al servidor: sin ella, la pantalla
  quedaría en blanco y el repartidor no sabría si se rompió la app o si está
  sin señal.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Envíos DosRuedas</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
        background: #001035;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      strong {
        display: block;
        font-size: 1.25rem;
        color: #ffec01;
      }
      p {
        margin: 0;
        color: #7f9de8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <strong>No se pudo abrir la app</strong>
    <p>
      Fijate que el celular tenga internet y volvé a abrirla.<br />
      Si tenés señal y sigue así, avisá a la oficina.
    </p>
  </body>
</html>
